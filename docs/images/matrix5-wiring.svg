<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5a3d"/>
      <stop offset="100%" stop-color="#1f4029"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="psuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#2b2b2b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#f7f7f5"/>
  <text x="520" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Matrix5 — Verkabelungsplan (ESP32-S3 + 2x HUB75 P4-2121-64x32, Seite an Seite)</text>
  <text x="520" y="52" text-anchor="middle" font-size="12" fill="#666">Reale Anordnung laut Foto: beide Panels bilden ein gemeinsames 128x32-Rahmenteil, nicht gestapelt</text>

  <!-- ESP32-S3 board -->
  <g>
    <rect x="30" y="90" width="215" height="400" rx="14" fill="url(#boardGrad)" stroke="#0d2414" stroke-width="2"/>
    <text x="137" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#eafff0">ESP32-S3</text>
    <text x="137" y="141" text-anchor="middle" font-size="12" fill="#bfe8cc">DevKitC-1</text>
    <rect x="48" y="158" width="178" height="55" rx="4" fill="#111" stroke="#444"/>
    <text x="137" y="188" text-anchor="middle" font-size="10" fill="#8bd6a0">USB-C (nur Strom/Flash,</text>
    <text x="137" y="201" text-anchor="middle" font-size="10" fill="#8bd6a0">nicht für Panel-Strom!)</text>

    <g font-size="12" fill="#eafff0">
      <text x="48" y="240">GPIO4  → R1</text>
      <text x="48" y="258">GPIO5  → G1</text>
      <text x="48" y="276">GPIO6  → B1</text>
      <text x="48" y="294">GPIO7  → R2</text>
      <text x="48" y="312">GPIO15 → G2</text>
      <text x="48" y="330">GPIO16 → B2</text>
      <text x="48" y="348">GPIO17 → A</text>
      <text x="48" y="366">GPIO18 → B</text>
      <text x="48" y="384">GPIO8  → C</text>
      <text x="48" y="402">GPIO9  → D</text>
      <text x="48" y="420">GPIO11 → LAT</text>
      <text x="48" y="438">GPIO12 → OE</text>
      <text x="48" y="456">GPIO13 → CLK</text>
    </g>
    <text x="137" y="478" text-anchor="middle" font-size="9" fill="#9fd6ac">(GPIO10 = E, unbenutzt bei 1/16-Scan)</text>
  </g>

  <!-- optional level shifter -->
  <g>
    <rect x="280" y="270" width="120" height="55" rx="6" fill="#e8e8e8" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="340" y="293" text-anchor="middle" font-size="11" fill="#333">74HCT245</text>
    <text x="340" y="308" text-anchor="middle" font-size="9" fill="#666">Levelshifter (empf.)</text>
  </g>

  <!-- Panel Left -->
  <g>
    <rect x="440" y="90" width="270" height="270" rx="8" fill="url(#panelGrad)" stroke="#000" stroke-width="2"/>
    <text x="575" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Panel links</text>
    <text x="575" y="140" text-anchor="middle" font-size="11" fill="#aaa">P4-2121-64x32-16S-HL1.0</text>
    <text x="575" y="157" text-anchor="middle" font-size="11" fill="#aaa">= Account A</text>
    <rect x="450" y="185" width="34" height="16" fill="#333" stroke="#666"/>
    <text x="467" y="197" text-anchor="middle" font-size="8" fill="#ccc">DATA_IN</text>
    <rect x="686" y="185" width="34" height="16" fill="#333" stroke="#666"/>
    <text x="703" y="197" text-anchor="middle" font-size="8" fill="#ccc">DATA_OUT</text>
    <circle cx="560" cy="240" r="4" fill="#e74c3c"/><text x="572" y="244" font-size="10" fill="#f5b7b1">VCC</text>
    <circle cx="600" cy="240" r="4" fill="#555"/><text x="612" y="244" font-size="10" fill="#ccc">GND</text>
    <text x="575" y="270" text-anchor="middle" font-size="9" fill="#7fbf7f">eigener 4-pol. Stecker (Foto)</text>
    <text x="575" y="286" text-anchor="middle" font-size="9" fill="#7fbf7f">+ 1000-2200uF Elko</text>
  </g>

  <!-- Panel Right -->
  <g>
    <rect x="730" y="90" width="270" height="270" rx="8" fill="url(#panelGrad)" stroke="#000" stroke-width="2"/>
    <text x="865" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Panel rechts</text>
    <text x="865" y="140" text-anchor="middle" font-size="11" fill="#aaa">P4-2121-64x32-16S-HL1.0</text>
    <text x="865" y="157" text-anchor="middle" font-size="11" fill="#aaa">= Account B</text>
    <rect x="740" y="185" width="34" height="16" fill="#333" stroke="#666"/>
    <text x="757" y="197" text-anchor="middle" font-size="8" fill="#ccc">DATA_IN</text>
    <rect x="976" y="185" width="34" height="16" fill="#333" stroke="#666"/>
    <text x="993" y="197" text-anchor="middle" font-size="8" fill="#ccc">(frei)</text>
    <circle cx="850" cy="240" r="4" fill="#e74c3c"/><text x="862" y="244" font-size="10" fill="#f5b7b1">VCC</text>
    <circle cx="890" cy="240" r="4" fill="#555"/><text x="902" y="244" font-size="10" fill="#ccc">GND</text>
    <text x="865" y="270" text-anchor="middle" font-size="9" fill="#7fbf7f">eigener 4-pol. Stecker (Foto)</text>
    <text x="865" y="286" text-anchor="middle" font-size="9" fill="#7fbf7f">+ 1000-2200uF Elko</text>
  </g>

  <!-- Data ribbon: ESP32 -> Panel Left IN -->
  <path d="M245,220 C 340,220 380,193 450,193" fill="none" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="180" font-size="11" fill="#2980b9" font-weight="600">HUB75-Ribbon (14 Signale)</text>

  <!-- Chain: Panel Left OUT -> Panel Right IN (panels adjoin directly) -->
  <path d="M720,193 L740,193" fill="none" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="723" y="215" font-size="9" fill="#2980b9" font-weight="600">Kette (Panels stossen aneinander)</text>

  <!-- PSU -->
  <g>
    <rect x="30" y="530" width="180" height="70" rx="10" fill="url(#psuGrad)" stroke="#111" stroke-width="2"/>
    <text x="120" y="558" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">5V Netzteil</text>
    <text x="120" y="575" text-anchor="middle" font-size="11" fill="#ddd">min. 6-10A, getrennt von USB!</text>
    <circle cx="55" cy="590" r="4" fill="#e74c3c"/><text x="65" y="594" font-size="10" fill="#f5b7b1">5V</text>
    <circle cx="100" cy="590" r="4" fill="#555"/><text x="110" y="594" font-size="10" fill="#ccc">GND</text>
  </g>

  <!-- Power: PSU -> Panel Left VCC/GND (routed right of the ESP32 board, clear of the level shifter) -->
  <path d="M55,530 L55,500 L252,500 L252,244 L556,244" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <path d="M100,530 L100,506 L260,506 L260,244 L596,244" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <!-- Power: PSU -> Panel Right VCC/GND (routed below both panels, then up between them) -->
  <path d="M55,530 L55,512 L733,512 L733,244 L846,244" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <path d="M100,530 L100,520 L745,520 L745,244 L886,244" fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- GND common ESP32/PSU -->
  <path d="M120,490 L120,530" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Legend -->
  <g transform="translate(280,530)">
    <rect x="0" y="0" width="250" height="55" fill="#fff" stroke="#ccc"/>
    <line x1="10" y1="16" x2="40" y2="16" stroke="#2980b9" stroke-width="3"/>
    <text x="46" y="20" font-size="11" fill="#333">HUB75-Datensignale / Kette</text>
    <line x1="10" y1="34" x2="40" y2="34" stroke="#e74c3c" stroke-width="3"/>
    <text x="46" y="38" font-size="11" fill="#333">5V-Einspeisung (separat je Panel!)</text>
  </g>

  <text x="520" y="612" text-anchor="middle" font-size="10" fill="#666">Für Hochkant-Montage: komplette 128x32-Einheit um 90° drehen, Software per setRotation() anpassen (keine Verkabelungsänderung)</text>
</svg>
